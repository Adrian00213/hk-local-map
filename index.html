<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港生活地圖</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            margin: 20px;
        }
        
        h1 {
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        
        .status {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            border-left: 5px solid #4CAF50;
        }
        
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin: 30px 0;
        }
        
        .feature {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            transition: all 0.3s;
        }
        
        .feature:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-5px);
        }
        
        .feature-icon {
            font-size: 2em;
            margin-bottom: 10px;
        }
        
        .actions {
            margin-top: 30px;
        }
        
        .btn {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin: 10px;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn:hover {
            background: linear-gradient(135deg, #45a049, #3d8b40);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
        
        .version {
            margin-top: 20px;
            font-size: 0.8em;
            color: rgba(255, 255, 255, 0.7);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🗺️ 香港生活地圖</h1>
        
        <div class="status">
            <h2>✅ 已恢復到原始版本</h2>
            <p>所有Minecraft更改已移除，返回原始功能。</p>
        </div>
        
        <div class="features">
            <div class="feature">
                <div class="feature-icon">🗺️</div>
                <h4>香港地圖</h4>
                <p>Google Maps集成</p>
            </div>
            <div class="feature">
                <div class="feature-icon">📰</div>
                <h4>資訊中心</h4>
                <p>智能推送資訊</p>
            </div>
            <div class="feature">
                <div class="feature-icon">🔍</div>
                <h4>搜索功能</h4>
                <p>附近地點搜索</p>
            </div>
            <div class="feature">
                <div class="feature-icon">👤</div>
                <h4>個人檔案</h4>
                <p>用戶設置同偏好</p>
            </div>
        </div>
        
        <div class="actions">
            <button class="btn" onclick="location.reload(true)">
                🔄 刷新頁面
            </button>
            <a href="https://github.com/adrian00213/hk-local-map" class="btn" target="_blank">
                🔧 GitHub倉庫
            </a>
        </div>
        
        <div class="version">
            <p>版本: <strong>原始版本 - 2026-03-31</strong></p>
            <p>已移除所有Minecraft相關更改</p>
            <p>返回原始香港生活地圖功能</p>
        </div>
    </div>
    
    <script>
        console.log('🗺️ 香港生活地圖 - 原始版本');
        console.log('已恢復到Minecraft更改之前嘅狀態');
        console.log('時間:', new Date().toLocaleString('zh-HK'));
        
        // 自動刷新檢查
        setTimeout(() => {
            console.log('✅ 網站運行正常');
        }, 3000);
    </script>
</body>
</html>
